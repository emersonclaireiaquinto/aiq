# Configuration for running ALL agents on OpenAI models.
# No NVIDIA NIM models are used — every role uses OpenAI.
#
# Required environment variables:
#   OPENAI_API_KEY    — Your OpenAI API key
#   TAVILY_API_KEY    — For web search
#
# Optional:
#   SERPER_API_KEY    — Uncomment paper_search_tool below to enable
#   OPENAI_BASE_URL   — Custom OpenAI-compatible endpoint (default: https://api.openai.com/v1)

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  # --------------------------------------------------------------------------
  # Intent classifier — moderate creativity for classification
  # --------------------------------------------------------------------------
  openai_intent_llm:
    _type: openai
    model_name: ${OPENAI_INTENT_MODEL:-qwen-small-instruct}
    base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    api_key: "${OPENAI_API_KEY}"
    # temperature: 0.5
    # top_p: 0.9
    # max_tokens: 4096

  # --------------------------------------------------------------------------
  # Research LLM — low temperature for factual accuracy
  # Used by: shallow researcher, clarifier
  # --------------------------------------------------------------------------
  openai_research_llm:
    _type: openai
    model_name: ${OPENAI_RESEARCH_MODEL:-qwen-small-instruct}
    base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    api_key: "${OPENAI_API_KEY}"
    # temperature: 0.1
    # top_p: 0.3
    # max_tokens: 16384

  # --------------------------------------------------------------------------
  # Orchestrator / Planner LLM — higher temperature for deep reasoning
  # Used by: deep research orchestrator, planner
  # --------------------------------------------------------------------------
  openai_orchestrator_llm:
    _type: openai
    model_name: ${OPENAI_ORCHESTRATOR_MODEL:-qwen-small-instruct}
    base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    api_key: "${OPENAI_API_KEY}"
    # temperature: 1.0
    # top_p: 1.0
    max_tokens: 128000

  # --------------------------------------------------------------------------
  # Summary LLM — conservative, short output for document summaries
  # --------------------------------------------------------------------------
  openai_summary_llm:
    _type: openai
    model_name: ${OPENAI_SUMMARY_MODEL:-qwen-small-instruct}
    base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    api_key: "${OPENAI_API_KEY}"
    # temperature: 0.3
    # max_tokens: 100

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: "Web Search"
        description: "Search the web for real-time information."
        tools:
          - web_search_tool
          - advanced_web_search_tool
      - id: paper_search
        name: "Academic Papers"
        description: "Search academic papers and scientific publications."
        tools:
          - paper_search_tool
      - id: knowledge_layer
        name: "Uploaded Documents"
        description: "Search your uploaded documents."
        tools:
          - knowledge_search

  web_search_tool:
    _type: tavily_web_search
    max_results: 5
    max_content_length: 1000

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 2
    advanced_search: true

  paper_search_tool:
    _type: paper_search
    max_results: 5
    serper_api_key: "${SERPER_API_KEY}"

  knowledge_search:
    _type: knowledge_retrieval
    backend: llamaindex
    collection_name: ${COLLECTION_NAME:-test_collection}
    generate_summary: true
    summary_model: openai_summary_llm
    summary_db: ${AIQ_SUMMARY_DB:-postgresql+psycopg://aiq:aiq_dev@aiq-postgres:5432/aiq_jobs}
    top_k: 5
    chroma_dir: ${AIQ_CHROMA_DIR:-/app/data/chroma_data}

  intent_classifier:
    _type: intent_classifier
    llm: openai_intent_llm
    verbose: true

  clarifier_agent:
    _type: clarifier_agent
    llm: openai_research_llm
    planner_llm: openai_research_llm
    tools:
      - web_search_tool
    max_turns: 3
    enable_plan_approval: true
    log_response_max_chars: 2000
    verbose: true

  shallow_research_agent:
    _type: shallow_research_agent
    llm: openai_research_llm
    verbose: true
    exclude_tools:
      - advanced_web_search_tool
    max_llm_turns: 10
    max_tool_iterations: 5

  deep_research_agent:
    _type: deep_research_agent
    orchestrator_llm: openai_orchestrator_llm
    researcher_llm: openai_research_llm
    planner_llm: openai_orchestrator_llm
    max_loops: 2
    verbose: true
    exclude_tools:
      - web_search_tool

workflow:
  _type: chat_deepresearcher_agent
  verbose: true
  enable_escalation: true
  enable_clarifier: true
  use_async_deep_research: true
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}
