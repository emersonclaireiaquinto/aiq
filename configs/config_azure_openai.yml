# Configuration for running ALL agents on Azure OpenAI.
# No NVIDIA NIM models are used — every role uses Azure OpenAI.
#
# Required environment variables:
#   AZURE_OPENAI_API_KEY      — Your Azure OpenAI API key
#   AZURE_OPENAI_ENDPOINT     — Your Azure OpenAI endpoint
#                                (e.g. https://<resource-name>.openai.azure.com)
#   TAVILY_API_KEY            — For web search
#
# Optional (override deployment names per role):
#   AZURE_OPENAI_INTENT_DEPLOYMENT      — Deployment for intent classifier (default: gpt-4o-mini)
#   AZURE_OPENAI_RESEARCH_DEPLOYMENT    — Deployment for researcher (default: gpt-4o)
#   AZURE_OPENAI_ORCHESTRATOR_DEPLOYMENT — Deployment for orchestrator (default: gpt-4o)
#   AZURE_OPENAI_SUMMARY_DEPLOYMENT     — Deployment for summaries (default: gpt-4o-mini)
#   AZURE_OPENAI_API_VERSION            — API version (default: 2024-10-21)
#   SERPER_API_KEY                       — Uncomment paper_search_tool below to enable
#
# How it works:
#   Azure OpenAI exposes an OpenAI-compatible endpoint. We use _type: openai
#   with base_url pointing to Azure's /openai/deployments/<deployment> path.
#   The api_key is passed as-is (Azure accepts it in the same header).

general:
  use_uvloop: true
  telemetry:
    logging:
      console:
        _type: console
        level: INFO

  front_end:
    _type: aiq_api
    runner_class: aiq_api.plugin.AIQAPIWorker
    db_url: ${NAT_JOB_STORE_DB_URL:-sqlite+aiosqlite:///./jobs.db}
    expiry_seconds: 86400
    cors:
      allow_origin_regex: 'http://localhost(:\d+)?|http://127.0.0.1(:\d+)?'
      allow_methods:
        - GET
        - POST
        - DELETE
        - OPTIONS
      allow_headers:
        - "*"
      allow_credentials: true
      expose_headers:
        - "*"

llms:
  # --------------------------------------------------------------------------
  # Intent classifier — moderate creativity for classification
  # --------------------------------------------------------------------------
  azure_intent_llm:
    _type: openai
    model_name: ${AZURE_OPENAI_INTENT_DEPLOYMENT:-gpt-4o-mini}
    base_url: "${AZURE_OPENAI_ENDPOINT}/openai/deployments/${AZURE_OPENAI_INTENT_DEPLOYMENT:-gpt-4o-mini}"
    api_key: ${AZURE_OPENAI_API_KEY}
    temperature: 0.5
    top_p: 0.9
    max_tokens: 4096
    default_headers:
      api-key: ${AZURE_OPENAI_API_KEY}
    default_query:
      api-version: ${AZURE_OPENAI_API_VERSION:-2024-10-21}

  # --------------------------------------------------------------------------
  # Research LLM — low temperature for factual accuracy
  # Used by: shallow researcher, clarifier
  # --------------------------------------------------------------------------
  azure_research_llm:
    _type: openai
    model_name: ${AZURE_OPENAI_RESEARCH_DEPLOYMENT:-gpt-4o}
    base_url: "${AZURE_OPENAI_ENDPOINT}/openai/deployments/${AZURE_OPENAI_RESEARCH_DEPLOYMENT:-gpt-4o}"
    api_key: ${AZURE_OPENAI_API_KEY}
    temperature: 0.1
    top_p: 0.3
    max_tokens: 16384
    default_headers:
      api-key: ${AZURE_OPENAI_API_KEY}
    default_query:
      api-version: ${AZURE_OPENAI_API_VERSION:-2024-10-21}

  # --------------------------------------------------------------------------
  # Orchestrator / Planner LLM — higher temperature for deep reasoning
  # Used by: deep research orchestrator, planner
  # --------------------------------------------------------------------------
  azure_orchestrator_llm:
    _type: openai
    model_name: ${AZURE_OPENAI_ORCHESTRATOR_DEPLOYMENT:-gpt-4o}
    base_url: "${AZURE_OPENAI_ENDPOINT}/openai/deployments/${AZURE_OPENAI_ORCHESTRATOR_DEPLOYMENT:-gpt-4o}"
    api_key: ${AZURE_OPENAI_API_KEY}
    temperature: 1.0
    top_p: 1.0
    max_tokens: 128000
    default_headers:
      api-key: ${AZURE_OPENAI_API_KEY}
    default_query:
      api-version: ${AZURE_OPENAI_API_VERSION:-2024-10-21}

  # --------------------------------------------------------------------------
  # Summary LLM — conservative, short output for document summaries
  # --------------------------------------------------------------------------
  azure_summary_llm:
    _type: openai
    model_name: ${AZURE_OPENAI_SUMMARY_DEPLOYMENT:-gpt-4o-mini}
    base_url: "${AZURE_OPENAI_ENDPOINT}/openai/deployments/${AZURE_OPENAI_SUMMARY_DEPLOYMENT:-gpt-4o-mini}"
    api_key: ${AZURE_OPENAI_API_KEY}
    temperature: 0.3
    max_tokens: 100
    default_headers:
      api-key: ${AZURE_OPENAI_API_KEY}
    default_query:
      api-version: ${AZURE_OPENAI_API_VERSION:-2024-10-21}

functions:
  data_sources:
    _type: data_source_registry
    sources:
      - id: web_search
        name: "Web Search"
        description: "Search the web for real-time information."
        tools:
          - web_search_tool
          - advanced_web_search_tool
      # - id: paper_search
      #   name: "Academic Papers"
      #   description: "Search academic papers and scientific publications."
      #   tools:
      #     - paper_search_tool

  web_search_tool:
    _type: tavily_web_search
    max_results: 5
    max_content_length: 1000

  advanced_web_search_tool:
    _type: tavily_web_search
    max_results: 2
    advanced_search: true

  # Paper Search (optional - requires SERPER_API_KEY)
  # paper_search_tool:
  #   _type: paper_search
  #   max_results: 5
  #   serper_api_key: ${SERPER_API_KEY}

  # Knowledge Retrieval (optional - uncomment to enable)
  # knowledge_search:
  #   _type: knowledge_retrieval
  #   backend: llamaindex
  #   collection_name: ${COLLECTION_NAME:-test_collection}
  #   generate_summary: true
  #   summary_model: azure_summary_llm
  #   summary_db: ${AIQ_SUMMARY_DB:-sqlite+aiosqlite:///./summaries.db}
  #   top_k: 5
  #   chroma_dir: ${AIQ_CHROMA_DIR:-/tmp/chroma_data}

  intent_classifier:
    _type: intent_classifier
    llm: azure_intent_llm
    verbose: true

  clarifier_agent:
    _type: clarifier_agent
    llm: azure_research_llm
    planner_llm: azure_research_llm
    tools:
      - web_search_tool
    max_turns: 3
    enable_plan_approval: true
    log_response_max_chars: 2000
    verbose: true

  shallow_research_agent:
    _type: shallow_research_agent
    llm: azure_research_llm
    verbose: true
    exclude_tools:
      - advanced_web_search_tool
    max_llm_turns: 10
    max_tool_iterations: 5

  deep_research_agent:
    _type: deep_research_agent
    orchestrator_llm: azure_orchestrator_llm
    researcher_llm: azure_research_llm
    planner_llm: azure_orchestrator_llm
    max_loops: 2
    verbose: true
    exclude_tools:
      - web_search_tool

workflow:
  _type: chat_deepresearcher_agent
  verbose: true
  enable_escalation: true
  enable_clarifier: true
  use_async_deep_research: true
  checkpoint_db: ${AIQ_CHECKPOINT_DB:-./checkpoints.db}
